[package]
name = "project-graph-bevy-canvas"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[features]
default = ["viewer"]
react-editor = ["viewer", "dep:wry", "dep:gtk", "dep:x11-dl"]
msdf = ["dep:kayak_font_msdf", "dep:parley"]
viewer = ["dep:bevy", "dep:resvg", "dep:image", "dep:bevy_egui", "dep:egui", "dep:rfd", "dep:avian2d", "dep:raw-window-handle", "dep:lyon_tessellation", "dep:winit", "dep:arboard", "dep:ratex-parser", "dep:ratex-layout", "dep:ratex-types", "dep:ratex-katex-fonts", "msdf"]

[dependencies]
bevy = { version = "=0.19.1", optional = true, default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_log", "bevy_winit", "x11", "wayland", "multi_threaded", "2d_bevy_render", "ui_bevy_render", "default_font", "system_font_discovery", "png", "jpeg", "keyboard", "mouse", "gestures"] }
rmp-serde = "=1.3.1"
rmpv = "=1.3.1"
undo = "=0.52.0"
tempfile = "=3.27.0"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
rusqlite = { version = "=0.40.2", features = ["bundled", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
zip = { version = "=8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
resvg = { version = "=0.48.1", optional = true }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png", "jpeg"] }
bevy_egui = { version = "=0.42.0", optional = true, default-features = false, features = ["render", "manage_clipboard", "default_fonts"] }
egui = { version = "=0.36.2", optional = true, default-features = false }
rfd = { version = "=0.17.2", optional = true }
avian2d = { version = "=0.7.0", optional = true, default-features = false, features = ["2d", "f32", "parry-f32", "parallel", "bevy_diagnostic"] }
raw-window-handle = { version = "=0.6.2", optional = true }
kayak_font_msdf = { version = "=0.5.0-pg.1", path = "vendor/kayak_font_msdf", optional = true }
parley = { version = "=0.9.0", default-features = false, features = ["std"], optional = true }
lyon_tessellation = { version = "=1.0.20", optional = true }
uuid = { version = "=1.27.0", features = ["v4"] }
arboard = { version = "=3.6.1", optional = true, features = ["wayland-data-control"] }
winit = { version = "=0.30.13", optional = true, default-features = false }
ratex-parser = { version = "=0.1.14", optional = true }
ratex-layout = { version = "=0.1.14", optional = true }
ratex-types = { version = "=0.1.14", optional = true }
ratex-katex-fonts = { version = "=0.1.14", optional = true }
ttf-parser = "=0.25.1"
wry = { version = "=0.57.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", optional = true }
x11-dl = { version = "=2.21.0", optional = true }

[workspace]
members = ["vendor/kayak_font_msdf", "app/src-tauri"]
default-members = ["."]
exclude = ["vendor/winit"]

[patch.crates-io]
winit = { path = "vendor/winit" }


[profile.release]
opt-level = 3
debug = 0

[profile.dev]
opt-level = 1

