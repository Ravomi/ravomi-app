[package]
name = "hm-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[lib]
name = "hm_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
project-graph-bevy-canvas = { path = "../..", default-features = false }
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-dialog = { version = "=2.8.1", default-features = false, features = ["xdg-portal"] }
